bind -n M-End detach-client
bind -n M-PageDown {
    switch-client -n
    refresh-client -S
}
bind -n M-PageUp {
    switch-client -p
    refresh-client -S
}

set -g remain-on-exit failed
set -g mouse on
set -g mode-keys vi

set -g status-left-length 200 
set -g status-left '#(bash -ic "tmux_session_list" 2>/dev/null)'
bind-key -T root MouseDown1StatusLeft run-shell 'bash -ic "tmux_click_session #{mouse_x}"'

bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
